name: clothing-site

x-minio-env: &minio_env
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  MINIO_BUCKET: "products"
  MINIO_SECURE: "0"
  MINIO_REGION: "us-east-1"
  MINIO_PUBLIC_ENDPOINT: "http://127.0.0.1:9100"
  MEDIA_PUBLIC_BASE_URL: "http://127.0.0.1:9100"

x-meili-env: &meili_env
  MEILI_HOST: "http://meilisearch:7700"
  MEILI_MASTER_KEY: "masterKey"
  MEILI_INDEX: "products"

x-runtime-env: &runtime_env
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: "INFO"

x-db-env: &db_env
  DATABASE_URL: "postgresql+psycopg2://clothing:clothing@db:5432/clothing"
  REDIS_URL: "redis://:redispass@redis:6379/0"

x-ai-env: &ai_env
  AI_ENABLED: "${AI_ENABLED:-true}"
  AI_PROVIDER: "${AI_PROVIDER:-gateway}"

  AI_GATEWAY_URL: "${AI_GATEWAY_URL:-https://ai.voicecrm.online}"
  AI_GATEWAY_TIMEOUT_S: "${AI_GATEWAY_TIMEOUT_S:-60}"

  AI_INTERNAL_TOKEN: "${AI_INTERNAL_TOKEN}"

  OPENAI_API_KEY: "${OPENAI_API_KEY}"
  OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-mini}"
  OPENAI_TIMEOUT_S: "${OPENAI_TIMEOUT_S:-45}"
  OPENAI_MAX_TOKENS: "${OPENAI_MAX_TOKENS:-600}"
  OPENAI_TEMPERATURE: "${OPENAI_TEMPERATURE:-0.2}"

  AI_MAX_RETRIES: "${AI_MAX_RETRIES:-3}"
  AI_RETRY_BACKOFF_S: "${AI_RETRY_BACKOFF_S:-2}"
  AI_MAX_IMAGE_MB: "${AI_MAX_IMAGE_MB:-15}"
  AI_STRICT_JSON: "${AI_STRICT_JSON:-1}"

services:
  # ============================================================
  # DATABASE
  # ============================================================
  db:
    image: postgres:16
    container_name: clothing-db
    environment:
      POSTGRES_DB: "clothing"
      POSTGRES_USER: "clothing"
      POSTGRES_PASSWORD: "clothing"
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothing -d clothing"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: clothing-redis
    command: ["redis-server", "--requirepass", "redispass"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  # ============================================================
  # MINIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: clothing-minio
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    command: ["server", "/data", "--console-address", ":9101"]
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9101"
    restart: unless-stopped

  # ============================================================
  # SEARCH
  # ============================================================
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: clothing-search
    environment:
      MEILI_MASTER_KEY: "masterKey"
    volumes:
      - meili_data:/meili_data
    ports:
      - "127.0.0.1:7700:7700"
    restart: unless-stopped

  # ============================================================
  # API
  # ============================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clothing-api
    environment:
      <<: [*db_env, *minio_env, *meili_env, *runtime_env, *ai_env]

      JWT_SECRET: "supersecret"
      JWT_ALG: "HS256"
      JWT_EXPIRES_MIN: "43200"

      PUBLIC_BASE_URL: "http://127.0.0.1:8001"
      UPLOAD_MAX_BYTES: "15000000"

    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8001", "--log-level", "debug"]
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      meilisearch:
        condition: service_started
    restart: unless-stopped

  # ============================================================
  # WEB (EDGE / GATEWAY)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clothing-web
    environment:
      PORT: "3000"

      API_HOST: "api"
      API_PORT: "8001"

      AI_HOST: "ai"
      AI_PORT: "8002"

      MINIO_HOST: "minio"
      MINIO_PORT: "9000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  # ============================================================
  # WORKER
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: clothing-worker
    environment:
      <<: [*db_env, *minio_env, *meili_env, *runtime_env, *ai_env]
      RQ_QUEUE: "clothing"
      AI_INTERNAL_URL: "http://api:8001"
    command: ["python", "apps/api/worker.py"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      meilisearch:
        condition: service_started
      api:
        condition: service_started
    restart: unless-stopped

  # ============================================================
  # OUTBOX CONSUMER
  # ============================================================
  outbox-consumer:
    build:
      context: .
      dockerfile: services/outbox_consumer/Dockerfile
    container_name: clothing-outbox-consumer
    environment:
      <<: [*runtime_env]
      DATABASE_URL: "postgresql+psycopg2://clothing:clothing@db:5432/clothing"
    command: ["python", "consumer.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data: {}
  minio_data: {}
  meili_data: {}
